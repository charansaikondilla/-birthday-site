<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>My Gifts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 20'%3E%3Crect width='11' height='20' fill='%23000'/%3E%3Cpath d='M0 0h3.3v20H0z' fill='%23e50914'/%3E%3Cpath d='M7.7 0H11v20H7.7z' fill='%23e50914'/%3E%3Cpath d='M0 0h3.3L11 20H7.7z' fill='%23b1060f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --red: #e50914; --line: #2a2a2a; --muted: #a3a3a3; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: Montserrat, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px clamp(18px, 4vw, 48px); background: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,0)); }
  .logo { font-family: "Bebas Neue", Montserrat, sans-serif; font-size: 34px; color: var(--red); letter-spacing: .04em; text-decoration: none; line-height: 1; }
  .who { color: var(--muted); font-size: 13px; }
  .signout { padding: 7px 14px; border: 1px solid #444; border-radius: 4px; background: none; color: #fff; font-size: 13px; }
  .signout:hover { border-color: #fff; }
  main { max-width: 820px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 40px) 60px; }
  h1 { margin: 10px 0 6px; font-size: clamp(26px, 4vw, 34px); }
  .lead { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
  .new-gift { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 26px; padding: 12px 20px; border-radius: 4px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; }
  .new-gift:hover { background: #f6121d; }
  .worker-note { margin: 0 0 20px; padding: 12px 14px; border: 1px solid #5a4500; border-radius: 6px; background: #1f1800; color: #ffd36b; font-size: 13px; line-height: 1.5; }
  .card { margin-bottom: 16px; padding: 20px; border: 1px solid var(--line); border-radius: 8px; background: #141414; }
  .card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .card h2 { margin: 0; font-family: Caveat, cursive; font-size: 30px; font-weight: 700; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
  .badge.paid { background: rgba(70, 211, 105, .14); color: #46d369; }
  .badge.trial { background: rgba(255, 193, 7, .14); color: #ffc107; }
  .badge.lock { background: rgba(255, 255, 255, .08); color: #ddd; }
  .badge.warn { background: rgba(229, 9, 20, .18); color: #ff6b72; }
  .meta { margin: 6px 0 14px; color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions a, .actions button { display: inline-flex; align-items: center; gap: 6px; padding: 9px 13px; border: 1px solid #3a3a3a; border-radius: 4px; background: transparent; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; }
  .actions a:hover, .actions button:hover { border-color: #fff; background: rgba(255, 255, 255, .06); }
  .actions .primary { border-color: #fff; background: #fff; color: #000; }
  .actions .primary:hover { background: #ddd; }
  .panel { margin-top: 14px; padding: 14px; border: 1px solid #333; border-radius: 6px; background: #0d0d0d; }
  .panel label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row input { flex: 1 1 200px; min-width: 0; padding: 11px 12px; border: 1px solid #444; border-radius: 4px; background: #161616; color: #fff; font: inherit; font-size: 15px; }
  .row input:focus { outline: 2px solid #fff; outline-offset: 1px; }
  .row button { padding: 0 14px; border: 0; border-radius: 4px; background: #333; color: #fff; font-weight: 700; font-size: 13px; min-height: 42px; }
  .row button.go { background: var(--red); }
  .share { white-space: pre-wrap; margin: 10px 0; padding: 12px; border-radius: 6px; background: #1b1b1b; color: #ddd; font-size: 13px; line-height: 1.5; }
  .qr-box { background: #fff; padding: 12px; border-radius: 8px; width: fit-content; margin: 4px 0 12px; }
  .qr-box canvas, .qr-box img { display: block; }
  .wa { background: #25d366 !important; color: #052e16 !important; border-color: #25d366 !important; }
  .msg { margin: 8px 0 0; font-size: 13px; }
  .msg.ok { color: #46d369; } .msg.bad { color: #ff7b7b; }
  .no-edit, .old-worker .needs-edit { display: none !important; }
  .old-worker .no-edit { display: inline !important; }
  .empty, .status { padding: 60px 0; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">PREMIERE</a>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="who" id="who"></span>
      <button class="signout" id="signout" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <h1>My gifts</h1>
    <p class="lead">Each gift is its own page with its own link and QR code. <span class="needs-edit">Customize it, then</span><span class="no-edit">Send</span> <span class="needs-edit">send </span>the link or QR — they open it without a password and never see the edit buttons.</p>
    <a class="new-gift" href="gift-create.html">＋ Create a new gift</a>
    <p class="worker-note" id="worker-note" hidden></p>
    <div id="list"><p class="status">Loading your gifts…</p></div>
  </main>
  <script src="cloud-config.js"></script>
  <script src="gift-store.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const list = $('#list');
    if (!GiftStore.Auth.isSignedIn() && !sessionStorage.getItem('auth-token') && !localStorage.getItem('auth-token')) location.href = 'login.html';
    const session = GiftStore.Auth.getSession();
    $('#who').textContent = session ? (session.name || session.email) : '';
    $('#signout').addEventListener('click', () => {
      GiftStore.Auth.signOut();
      sessionStorage.removeItem('auth-token');
      localStorage.removeItem('auth-token');
      location.href = 'login.html';
    });
    const WORDS = ['rose', 'moon', 'star', 'cake', 'honey', 'sunny', 'candy', 'dream', 'angel', 'smile', 'sweet', 'magic', 'cherry', 'pearl', 'bunny'];
    const suggest = () => `${WORDS[Math.floor(Math.random() * WORDS.length)]}-${WORDS[Math.floor(Math.random() * WORDS.length)]}${10 + Math.floor(Math.random() * 90)}`;
    const copy = async (text, btn, label) => {
      try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied ✓'; } catch { btn.textContent = 'Select & copy above'; }
      setTimeout(() => { btn.textContent = label; }, 2000);
    };
    let gifts = [];

    function card(g) {
      const expired = !g.paid && GiftStore.isExpired(g.createdAt);
      const badges = [
        g.paid ? '<span class="badge paid">Kept forever</span>' : `<span class="badge trial">${expired ? 'Trial expired' : 'Free trial · ' + esc(GiftStore.fmtLeft(g.createdAt))}</span>`,
        g.hasPassword ? '<span class="badge warn">🔒 Has an old password</span>' : '<span class="badge lock">🔓 Opens with the link</span>',
      ].join('');
      const view = GiftStore.viewLinkFor(g.slug);
      return `<div class="card" data-slug="${esc(g.slug)}">
        <div class="card-top"><h2>${g.name ? `For ${esc(g.name)}` : 'Untitled gift'}</h2><div class="badges">${badges}</div></div>
        <p class="meta">Created ${esc(new Date(g.createdAt).toLocaleDateString())}${g.paidAt ? ' · paid ' + esc(new Date(g.paidAt).toLocaleDateString()) : ''}</p>
        <div class="actions">
          <a class="primary needs-edit" href="${esc(view)}">✎ Customize their page</a>
          <a href="${esc(view)}&amp;preview=1" target="_blank" rel="noopener">👁 See it as them</a>
          <button type="button" data-act="share">📤 Share link &amp; QR</button>
          ${g.hasPassword ? '<button type="button" data-act="remove-pw">🔓 Remove password</button>' : ''}
          <button type="button" data-act="copy-upload">＋ Friends' photo link</button>
        </div>
        <div class="panel" data-panel hidden></div>
        <p class="msg" data-msg hidden></p>
      </div>`;
    }
    function paint() {
      list.innerHTML = gifts.length ? gifts.map(card).join('') : '<p class="empty">No gifts yet — create your first one above.</p>';
    }
    function say(el, text, ok) { const m = $('[data-msg]', el); m.textContent = text; m.className = `msg ${ok ? 'ok' : 'bad'}`; m.hidden = !text; }

    list.addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const el = b.closest('.card'), g = gifts.find((x) => x.slug === el.dataset.slug);
      if (!g) return;
      const act = b.dataset.act, panel = $('[data-panel]', el);
      say(el, '', true);
      if (act === 'copy-upload') return copy(GiftStore.linkFor(g.slug), b, "＋ Friends' photo link");
      if (act === 'share') {
        panel.hidden = !panel.hidden;
        if (panel.hidden) return;
        const view = GiftStore.viewLinkFor(g.slug);
        const text = GiftStore.shareMessage(g);
        panel.dataset.text = text;
        panel.dataset.link = view;
        panel.innerHTML = `<label>Scan to open ${g.name ? esc(g.name) + '’s' : 'their'} page</label>
          <div class="qr-box" data-qr></div>
          <div class="row"><input readonly value="${esc(view)}" aria-label="Their page link"><button type="button" data-act="copy-link">🔗 Copy link</button></div>
          <div class="share">${esc(text)}</div>
          <div class="actions"><a class="wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">📲 Send on WhatsApp</a>
            <button type="button" data-act="copy-msg">📋 Copy message</button>
            <a href="#" data-qr-dl download="birthday-qr${g.name ? '-' + esc(g.name.replace(/[^\w-]+/g, '')) : ''}.png">⬇ Download QR</a></div>
          <p class="msg" style="color:#8c8c8c">No password needed: the page opens with the intro, and they never see the edit buttons.${g.hasPassword ? ' (This older gift still has a password — press “Remove password” above.)' : ''}</p>`;
        const box = $('[data-qr]', panel), dl = $('[data-qr-dl]', panel);
        if (!GiftStore.drawQR(box, view, 200)) dl.style.display = 'none';
        dl.addEventListener('click', (ev) => { const png = GiftStore.qrImage(box); if (png) dl.href = png; else ev.preventDefault(); });
        return;
      }
      if (act === 'copy-link') return copy(panel.dataset.link || '', b, '🔗 Copy link');
      if (act === 'copy-msg') return copy(panel.dataset.text || '', b, '📋 Copy message');
      if (act === 'remove-pw') {
        b.disabled = true; b.textContent = 'Removing…';
        try {
          const fresh = await GiftStore.setGiftPassword(g.slug, '');
          Object.assign(g, fresh || {}, { hasPassword: false });
          paint();
          say(list.querySelector(`[data-slug="${CSS.escape(g.slug)}"]`), 'Password removed ✓ — the link now opens straight away.', true);
        } catch (err) { say(el, err.message || 'Could not remove the password.', false); b.disabled = false; b.textContent = '🔓 Remove password'; }
        return;
      }
    });

    (async () => {
      try {
        // An older Worker can't save a customised page yet, so don't offer it.
        GiftStore.info().then((i) => document.body.classList.toggle('old-worker', i.v === 1));
        gifts = await GiftStore.listMyGifts();
        paint();
      } catch (e) {
        list.innerHTML = `<p class="status">Could not load your gifts: ${esc(e.message || 'unknown error')}</p>`;
      }
    })();
  </script>
</body>
</html>
