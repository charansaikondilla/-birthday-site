<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>Happy Birthday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 20'%3E%3Crect width='11' height='20' fill='%23000'/%3E%3Cpath d='M0 0h3.3v20H0z' fill='%23e50914'/%3E%3Cpath d='M7.7 0H11v20H7.7z' fill='%23e50914'/%3E%3Cpath d='M0 0h3.3L11 20H7.7z' fill='%23b1060f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="cloud-config.js"></script>
  <script src="gift-store.js"></script>
  <script>
    // Gift viewers skip auth — the gift slug is their key; only the owner needs to log in
    (function() {
      if (new URLSearchParams(location.search).has('gift')) return;
      const isAuth = sessionStorage.getItem('auth-token') || localStorage.getItem('auth-token');
      if (!isAuth) window.location.href = 'landing.html';
    })();
  </script>
</head>
<body>

  <!-- 1. INTRO — the N logo builds, holds, then bursts into colour ribbons -->
  <section id="intro" class="screen intro" aria-label="Intro">
    <div class="n-logo" aria-hidden="true">
      <span class="n-left"></span>
      <span class="n-right"></span>
      <span class="n-diag"></span>
    </div>
    <div class="ribbons" aria-hidden="true"></div>
  </section>

  <!-- 2. WHO'S WATCHING -->
  <section id="profiles" class="screen profiles" hidden aria-label="Choose a profile">
    <h1>Who's watching?</h1>
    <div class="profiles-grid" id="profiles-grid"></div>
  </section>

  <!-- 3. HOME -->
  <section id="home" class="screen home" hidden aria-label="Home">
    <div class="hero" id="hero" aria-hidden="true"></div>
    <div class="hero-feature" id="hero-feature" aria-hidden="true"><span class="hero-feature-label">Featuring</span><span id="hero-feature-name"></span></div>
    <div class="hero-shade" aria-hidden="true"></div>

    <nav class="sidebar" aria-label="Menu">
      <button aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      <button aria-label="Home" class="is-active"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
      <button aria-label="History"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v5h5"/><path d="M12 8v4.5l3 2"/></svg></button>
      <button aria-label="Trending"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M6 21v-7"/><path d="M11 21V10"/><path d="M16 21V6"/><path d="M4 9l4-3 4 2 5-5"/></svg></button>
      <button aria-label="TV"><svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="13" rx="1.5"/><path d="M8 21h8"/><path d="M12 17.5V21"/></svg></button>
      <button aria-label="Movies"><svg viewBox="0 0 24 24"><path d="M3 9h18v11H3z"/><path d="m3.5 9-1-3.5 17.5-3 .8 3.5"/><path d="m7.5 8.2-1.2-3.4M12.5 7.3l-1.2-3.4M17.5 6.4l-1.2-3.4"/></svg></button>
      <button aria-label="Add" class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>

    <div class="content">
      <p class="series"><span class="n-mini" aria-hidden="true"><i></i><i></i><i></i></span>SERIES</p>
      <h1 class="title" id="title" aria-live="polite"><span id="title-text"></span><span class="caret" aria-hidden="true"></span></h1>
      <div class="facts" id="facts"></div>
      <p class="description" id="description"></p>
      <div class="buttons">
        <button class="btn play" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Play</button>
        <button class="btn more" id="more">More Info</button>
      </div>
      <div class="rows" id="rows"></div>

      <footer class="footer">
        <div class="footer-social" aria-hidden="true">
          <span><svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v6h4v-6h3l1-4h-4V8z"/></svg></span>
          <span><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></span>
          <span><svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4 4 20"/></svg></span>
          <span><svg viewBox="0 0 24 24"><path d="M21 8.5a3 3 0 0 0-2-2C17.3 6 12 6 12 6s-5.3 0-7 .5a3 3 0 0 0-2 2C2.5 10.2 2.5 12 2.5 12s0 1.8.5 3.5a3 3 0 0 0 2 2c1.7.5 7 .5 7 .5s5.3 0 7-.5a3 3 0 0 0 2-2c.5-1.7.5-3.5.5-3.5s0-1.8-.5-3.5z"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg></span>
        </div>
        <div class="footer-links" id="footer-links"></div>
        <p class="footer-note" id="footer-note"></p>
      </footer>
    </div>
  </section>

  <!-- 4. PLAYER — image slideshow inside the player chrome -->
  <section id="player" class="screen player" hidden aria-label="Now playing">
    <div class="slides" id="slides"></div>

    <div class="player-ui" id="player-ui">
      <div class="ui-top">
        <button class="icon back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5"/><path d="m11 6-6 6 6 6"/></svg></button>
        <p class="now-title" id="player-title"></p>
        <button type="button" id="player-edit-chip" class="player-edit-chip" aria-label="Stop editing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg><span>Done editing</span>
        </button>
        <span class="icon cast" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17.5V20h2.5"/><path d="M3 13.5a6.5 6.5 0 0 1 6.5 6.5"/><path d="M3 9.5A10.5 10.5 0 0 1 13.5 20"/><path d="M3 6.5V5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3.5"/></svg></span>
      </div>
      <!-- Shown over the picture while editing, so it's obvious a tap swaps it -->
      <div class="player-edit-cue" id="player-edit-cue" aria-hidden="true"><span class="cue-icon">🎥</span><span id="player-edit-cue-text">Tap the picture to change it</span></div>

      <div class="brightness" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span></span></div>

      <div class="ui-center">
        <button class="skip" id="prev" aria-label="Previous"><svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 1-12.8 6.4"/><path d="M9 6v9h9"/></svg><b>10</b></button>
        <button class="pause" id="pause" aria-label="Pause"><svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg><svg class="ic-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
        <button class="skip" id="next" aria-label="Next"><svg viewBox="0 0 48 48"><path d="M24 8a16 16 0 1 0 12.8 6.4"/><path d="M39 6v9h-9"/></svg><b>10</b></button>
      </div>

      <div class="ui-bottom">
        <div class="progress" id="progress"><span class="bar" id="bar"></span><span class="dot" id="dot"></span></div>
        <span class="time" id="time"></span>
        <div class="tools">
          <span class="snap" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8.5V7a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1.5"/><circle cx="12" cy="12.5" r="3.5"/></svg></span>
          <span class="tool"><svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>Speed (1×)</span>
          <span class="tool"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Lock</span>
          <span class="tool"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="14" height="11" rx="1.5"/><path d="M7 8V5.5h14V17h-3"/></svg>Episode</span>
          <span class="tool"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3"/></svg>Audio &amp; Subtitle</span>
        </div>
      </div>
    </div>

    <div class="finale" id="finale" hidden>
      <div class="credits-wrap" id="credits-wrap">
        <div class="credits-reel" id="credits-reel">
          <div class="credits-badge">
            <span class="n-mini" aria-hidden="true"><i></i><i></i><i></i></span>
            <span>ORIGINAL</span>
          </div>
          <h2 class="credits-headline" id="finale-title"></h2>
          <div class="credits-lines" id="finale-lines"></div>
          <div class="credits-divider"></div>
          <div class="credits-block" id="credits-block"></div>
          <div class="credits-divider"></div>
          <p class="credits-footer" id="credits-footer"></p>
          <div style="height:8vh"></div>
        </div>
      </div>
      <div class="credits-actions" id="credits-actions">
        <button class="btn play" id="replay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Replay</button>
        <button class="btn more" id="finale-home">Back to Home</button>
      </div>
    </div>
  </section>

  <!-- More Info -->
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <button class="close" id="modal-close" aria-label="Close">×</button>
      <div class="modal-art" id="modal-art"></div>
      <div class="modal-body">
        <p class="series"><span class="n-mini" aria-hidden="true"><i></i><i></i><i></i></span>SERIES</p>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <button class="btn play" id="modal-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>Play</button>
      </div>
    </div>
  </div>

  <!-- The auto-play cursor that walks through the site like in the video -->
  <div id="cursor" class="cursor" hidden aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M5 3l14 9.5-6.2 1 3.4 6.4-2.7 1.4-3.3-6.4L5 19z"/></svg>
  </div>

  <!-- ✎ Edit: toggles live click-to-edit mode right on the page -->
  <button id="cz-fab" class="cz-fab" type="button" aria-label="Turn on editing — click any photo, video or text to change it">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
    <span>Edit</span>
  </button>
  <button id="cz-more" class="cz-fab cz-more-fab" type="button" aria-label="More settings" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    <span>More settings</span>
  </button>
  <div id="cz" class="cz" hidden role="dialog" aria-modal="true" aria-labelledby="cz-heading">
    <aside class="cz-drawer">
      <header class="cz-head">
        <span class="n-mini" aria-hidden="true"><i></i><i></i><i></i></span>
        <h2 id="cz-heading">Customize</h2>
        <span id="cz-status" class="cz-status" aria-live="polite"></span>
        <button id="cz-close" class="cz-x" type="button" aria-label="Close">×</button>
      </header>
      <nav id="cz-tabs" class="cz-tabs" aria-label="Sections"></nav>
      <div id="cz-body" class="cz-body"></div>
      <footer class="cz-foot">
        <button id="cz-cancel" class="cz-btn cz-btn-ghost" type="button">Cancel</button>
        <button id="cz-save" class="cz-btn cz-btn-primary" type="button">Save &amp; apply</button>
      </footer>
    </aside>
  </div>

  <a id="gift-add" class="cz-fab gift-add-fab" href="gift-upload.html" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add photos</span></a>

  <!-- Logout button -->
  <button id="logout-btn" class="cz-fab logout-fab" type="button" aria-label="Logout" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 8l4-4M20 4v8h-8"/></svg>
    <span>Logout</span>
  </button>

  <script src="script.js"></script>
</body>
</html>
