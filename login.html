<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>Login - Happy Birthday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 20'%3E%3Crect width='11' height='20' fill='%23000'/%3E%3Cpath d='M0 0h3.3v20H0z' fill='%23e50914'/%3E%3Cpath d='M7.7 0H11v20H7.7z' fill='%23e50914'/%3E%3Cpath d='M0 0h3.3L11 20H7.7z' fill='%23b1060f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="dns-prefetch" href="https://accounts.google.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-card {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(229, 9, 20, 0.3);
      border-radius: 8px;
      padding: 40px 30px;
      backdrop-filter: blur(10px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .n-logo-login {
      font-size: 48px;
      font-weight: 800;
      color: #e50914;
      margin-bottom: 16px;
      letter-spacing: -2px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #999;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: #e50914;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.3);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-group.checkbox {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
    }

    .form-group.checkbox label {
      margin: 0;
      font-size: 13px;
      text-transform: none;
      letter-spacing: normal;
      cursor: pointer;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #e50914;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 16px;
    }

    .btn-login:hover {
      background: #f40612;
      box-shadow: 0 8px 24px rgba(229, 9, 20, 0.4);
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .btn-skip {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-skip:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #e50914;
    }

    .skip-note {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.55);
      text-align: center;
    }

    .error-message {
      display: none;
      color: #e50914;
      font-size: 13px;
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(229, 9, 20, 0.1);
      border-radius: 4px;
      border-left: 3px solid #e50914;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    [hidden] { display: none !important; }
    /* Email + password (for people without Gmail) */
    .or-line { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; color: rgba(255,255,255,.45); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .or-line::before, .or-line::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.15); }
    .em-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px; background: rgba(255,255,255,.06); border-radius: 6px; padding: 4px; }
    .em-tabs button { padding: 9px 6px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,.7); font: 600 13px 'Montserrat', sans-serif; cursor: pointer; }
    .em-tabs button[aria-selected="true"] { background: #e50914; color: #fff; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 64px; }
    .pw-eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: rgba(255,255,255,.7); font: 700 11px 'Montserrat', sans-serif; letter-spacing: .05em; cursor: pointer; padding: 8px; }
    .em-hint { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 6px; }
    .btn-login:disabled { opacity: .6; cursor: wait; }
    .ok-message { display: none; color: #46d369; font-size: 13px; margin-bottom: 16px; padding: 12px; background: rgba(70,211,105,.1); border-radius: 4px; border-left: 3px solid #46d369; }
    .ok-message.show { display: block; }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }

      .n-logo-login {
        font-size: 40px;
      }

      .login-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="n-logo-login">N</div>
        <h1 class="login-title">Welcome</h1>
        <p class="login-subtitle" id="login-subtitle">Sign in to create and manage your gifts</p>
      </div>

      <div class="error-message" id="error-message"></div>

      <div class="ok-message" id="ok-message" role="status"></div>
      <div id="google-btn" style="display:flex;justify-content:center;margin-bottom:16px"></div>

      <div id="email-box" hidden>
        <p class="or-line">or use your email</p>
        <div class="em-tabs" role="tablist" aria-label="Email sign-in">
          <button type="button" role="tab" id="tab-login" aria-selected="true">Sign in</button>
          <button type="button" role="tab" id="tab-signup" aria-selected="false">Create account</button>
        </div>
        <form id="email-form" novalidate>
          <div class="form-group" id="name-group" hidden>
            <label for="em-name">Your name</label>
            <input type="text" id="em-name" maxlength="80" autocomplete="name" placeholder="e.g. Charan">
          </div>
          <div class="form-group">
            <label for="em-email">Email</label>
            <input type="email" id="em-email" maxlength="254" autocomplete="email" inputmode="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="em-pass">Password</label>
            <div class="pw-wrap">
              <input type="password" id="em-pass" maxlength="128" autocomplete="current-password" placeholder="Your password" required>
              <button type="button" class="pw-eye" id="em-eye" aria-label="Show the password">SHOW</button>
            </div>
            <p class="em-hint" id="em-hint" hidden>At least 6 characters. Any email works — Gmail not needed.</p>
          </div>
          <button type="submit" class="btn-login" id="em-go">Sign in</button>
        </form>
      </div>

      <form id="login-form" style="display:none">
        <div class="form-group">
          <label for="access-code">Access Code</label>
          <input type="password" id="access-code" placeholder="Enter your access code" autocomplete="off">
        </div>
        <div class="form-group checkbox">
          <input type="checkbox" id="remember-me">
          <label for="remember-me">Remember me on this device</label>
        </div>
        <button type="submit" class="btn-login">Enter</button>
      </form>
      <button type="button" class="btn-skip" id="skip-btn">Skip — start editing without signing in</button>
      <p class="skip-note">Your changes are saved on this device. Sign in later to get a link to share.</p>
    </div>
  </div>

  <script src="cloud-config.js"></script>
  <script src="gift-store.js"></script>
  <script>
    const errorMessage = document.getElementById('error-message');
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 4000);
    }

    // Already signed in (real Google session, or the old access-code flow)? Skip straight through.
    if ((window.GiftStore && GiftStore.Auth.isSignedIn()) || sessionStorage.getItem('auth-token') || localStorage.getItem('auth-token')) {
      window.location.href = 'my-gifts.html';
    }

    const clientId = window.CLOUD && window.CLOUD.GOOGLE_CLIENT_ID;
    if (clientId) {
      // Real Gmail sign-in path. Waits for the GSI script (loaded in <head>)
      // instead of window.onload, so the button/One Tap appear as soon as
      // Google's script is ready rather than after every image/font loads.
      let initedOnce = false;
      function initGoogleSignIn() {
        if (initedOnce) return;
        if (!(window.google && window.google.accounts && window.google.accounts.id)) return;
        initedOnce = true;

        google.accounts.id.initialize({
          client_id: clientId,
          callback: async ({ credential }) => {
            try {
              await GiftStore.Auth.signInWithGoogle(credential);
              window.location.href = 'my-gifts.html';
            } catch (e) {
              showError(e.message || 'Could not sign in with Google.');
            }
          },
          auto_select: true,            // auto sign-in silently if the browser remembers one Google account
          cancel_on_tap_outside: false, // don't dismiss the One Tap prompt on an accidental outside click
          use_fedcm_for_prompt: true,   // use the modern FedCM flow (fewer third-party-cookie errors)
          itp_support: true,            // keep One Tap working in Safari/ITP browsers
        });
        google.accounts.id.renderButton(document.getElementById('google-btn'), { theme: 'outline', size: 'large', width: 260 });

        // Also trigger the One Tap auto-prompt so a returning user is
        // signed in automatically without clicking the button.
        // No status callback: Google deprecated the isNotDisplayed()/isSkippedMoment()
        // methods under FedCM. If One Tap can't show, the button above is the fallback.
        google.accounts.id.prompt();
      }

      // The script in <head> is async; poll briefly in case it hasn't
      // finished parsing yet, so init runs the instant it's ready.
      if (window.google && window.google.accounts && window.google.accounts.id) {
        initGoogleSignIn();
      } else {
        const poll = setInterval(() => {
          if (window.google && window.google.accounts && window.google.accounts.id) {
            clearInterval(poll);
            initGoogleSignIn();
          }
        }, 50);
        setTimeout(() => {
          clearInterval(poll);
          if (!initedOnce) {
            document.getElementById('google-btn').innerHTML = '<p style="color:#999;font-size:12px;text-align:center">Google sign-in failed to load. Check your connection and refresh.</p>';
          }
        }, 8000);
      }
    } else {
      // Not configured yet — fall back to the old access-code login so the
      // site still works, and say clearly what's missing.
      document.getElementById('login-subtitle').textContent = 'Enter your access code to begin';
      document.getElementById('google-btn').innerHTML = '<p style="color:#999;font-size:12px;text-align:center">Google sign-in isn\'t configured yet — add GOOGLE_CLIENT_ID to cloud-config.js.</p>';
      document.getElementById('login-form').style.display = '';
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const code = document.getElementById('access-code').value.trim();
        if (code.length < 4) { showError('Access code must be at least 4 characters'); return; }
        const remember = document.getElementById('remember-me').checked;
        const token = 'auth_' + Date.now();
        (remember ? localStorage : sessionStorage).setItem('auth-token', token);
        window.location.href = 'my-gifts.html';
      });
    }

    // ---- Email + password: each person gets their own account and their own gifts ----
    if (window.GiftStore && GiftStore.mode === 'cloud') {
      const box = document.getElementById('email-box');
      const form = document.getElementById('email-form');
      const go = document.getElementById('em-go');
      const pass = document.getElementById('em-pass');
      const tabLogin = document.getElementById('tab-login'), tabSignup = document.getElementById('tab-signup');
      let mode = 'login';
      // Shown once the Worker supports email accounts (or when there is no Google sign-in at all).
      GiftStore.info().then((i) => { box.hidden = !(i.accounts || !clientId); });
      if (!clientId) { // no Google: email is the main way in, not "or"
        document.getElementById('google-btn').innerHTML = '';
        document.getElementById('login-form').style.display = 'none';
        box.querySelector('.or-line').hidden = true;
        document.getElementById('login-subtitle').textContent = 'Sign in to create and manage your gifts';
      }
      const setMode = (m) => {
        mode = m;
        tabLogin.setAttribute('aria-selected', String(m === 'login'));
        tabSignup.setAttribute('aria-selected', String(m === 'signup'));
        document.getElementById('name-group').hidden = m !== 'signup';
        document.getElementById('em-hint').hidden = m !== 'signup';
        pass.autocomplete = m === 'signup' ? 'new-password' : 'current-password';
        pass.placeholder = m === 'signup' ? 'Choose a password' : 'Your password';
        go.textContent = m === 'signup' ? 'Create my account' : 'Sign in';
        errorMessage.classList.remove('show');
      };
      tabLogin.addEventListener('click', () => setMode('login'));
      tabSignup.addEventListener('click', () => setMode('signup'));
      document.getElementById('em-eye').addEventListener('click', (e) => {
        const show = pass.type === 'password';
        pass.type = show ? 'text' : 'password';
        e.currentTarget.textContent = show ? 'HIDE' : 'SHOW';
        e.currentTarget.setAttribute('aria-label', show ? 'Hide the password' : 'Show the password');
      });
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('em-email').value.trim();
        const password = pass.value;
        const name = document.getElementById('em-name').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { showError('Please enter a valid email address.'); return; }
        if (mode === 'signup' && password.length < 6) { showError('Choose a password with at least 6 characters.'); return; }
        if (!password) { showError('Please enter your password.'); return; }
        go.disabled = true;
        const label = go.textContent;
        go.textContent = mode === 'signup' ? 'Creating your account…' : 'Signing in…';
        try {
          await GiftStore.Auth.withEmail(mode, email, password, name);
          const ok = document.getElementById('ok-message');
          ok.textContent = mode === 'signup' ? 'Account created ✓ — opening your gifts…' : 'Signed in ✓';
          ok.classList.add('show');
          window.location.href = 'my-gifts.html';
        } catch (ex) {
          showError(ex.message || 'Could not sign in — please try again.');
          go.disabled = false;
          go.textContent = label;
        }
      });
    }

    document.getElementById('skip-btn').addEventListener('click', () => { window.location.href = 'netflix.html?edit=1'; });
  </script>
</body>
</html>
